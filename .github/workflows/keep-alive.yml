# STUB — evita que o schedule seja DESATIVADO apos 60 dias sem atividade.
# So' commit/push conta como atividade (issue/comentario/star NAO contam).
name: keep-alive
on:
  schedule:
    - cron: "17 6 */20 * *"   # a cada ~20 dias
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit de manutencao
        run: |
          git config user.name  "vixeee-bot"
          git config user.email "bot@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keep-alive" || echo "sem mudanca"
          git push || echo "nada a empurrar"
